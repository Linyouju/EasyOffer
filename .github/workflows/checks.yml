name: Checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:v2
      - run: npm run test:browser
