<!doctype html><html lang="zh"><meta charset="utf-8"><title>智能网申测试 · 虚构资料</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;background:#f6f3fc}section{background:white;border-radius:16px;padding:25px;margin:20px 0}.form-item{margin:14px 0}label{display:block;margin:5px 0}input,select,textarea{padding:10px;border:1px solid #cabfe0;border-radius:6px;width:65%;font:inherit}button{padding:12px;background:#7552cb;color:white;border:0;border-radius:8px;margin:5px}#audit{white-space:pre-wrap}</style>
<h1>智能网申集成测试</h1><p>虚构资料，离线模拟 AI 返回，不会向招聘网站提交。</p><button id="start">开始测试</button><div id="form"></div><pre id="audit">等待开始</pre>
<script>
const listeners=[];const store={userProfile:{degree:'硕士研究生',currentCity:'杭州市'},experiences:{education:[{school:'测试大学',degree:'硕士研究生',period:'2024.09 - 2027.06'},{school:'示例学院',degree:'本科',period:'2020.09 - 2024.06'}],project:[{name:'演示设计项目',role:'交互设计',period:'2025.01 - 2025.06',description:'研究用户流程，并交付交互原型。'}]}};
let added=0,nextClicks=0,submissions=0;
window.chrome={runtime:{onMessage:{addListener:f=>listeners.push(f),removeListener:f=>{const i=listeners.indexOf(f);if(i>=0)listeners.splice(i,1)}},sendMessage:async msg=>{
 if(msg.type==='OJT_AGENT_RESUME')return {resume:false};
 if(msg.type==='MAP_FORM_FIELDS')return {ok:true,threshold:.92,mappings:msg.payload.fields.flatMap(f=>{let id;if(f.label.includes('居住'))id='profile.currentCity';else if(f.label.includes('描述'))id='project.0.description';return id?[{fieldId:f.id,sourceId:id,confidence:.99}]:[]})};
 return {ok:true};
 }},storage:{local:{get:async()=>store}}};
function education(){return '<div class="block"><div class="form-item"><label>学校名称</label><input required></div><div class="form-item"><label>学历</label><select required><option value="">请选择</option><option>本科</option><option>硕士研究生</option></select></div><div class="form-item"><label>开始时间</label><input required type="month"></div><div class="form-item"><label>结束时间</label><input required type="month"></div></div>'}
form.innerHTML='<section><h2>个人信息</h2><div class="form-item"><label>居住地</label><input required></div></section><section id="edu"><h2>教育经历</h2><div id="blocks">'+education()+'</div><button id="add">+ 添加</button></section><button id="next">下一步</button>';
add.onclick=()=>{added++;blocks.insertAdjacentHTML('beforeend',education())};
next.onclick=()=>{nextClicks++;if([...document.querySelectorAll('[required]')].some(el=>!el.value))return;const schools=[...document.querySelectorAll('#blocks .block')].map(b=>b.querySelector('input').value);audit.textContent='学校：'+schools.join(' / ')+'\n新增次数：'+added+'\n下一页次数：'+nextClicks;form.innerHTML='<section><h2>项目经历</h2><div class="form-item"><label>项目名称</label><input required></div><div class="form-item"><label>项目角色</label><input required></div><div class="form-item"><label>项目描述</label><textarea required></textarea></div></section><button id="submit">提交申请</button>';document.getElementById('submit').onclick=()=>{submissions++;audit.textContent+='\nERROR: 不应提交'};};
document.getElementById('start').onclick=()=>listeners.forEach(f=>f({type:'START_APPLICATION_AGENT'},{},result=>{if(!result.ok)audit.textContent=result.error}));
</script>
<script src="../../integrations/openjobtracker/ui-icons.js"></script><script src="../../integrations/openjobtracker/job-validator.js"></script><script src="../../integrations/openjobtracker/semantic-mapper.js"></script><script src="../../integrations/openjobtracker/content.js"></script><script src="../../integrations/openjobtracker/application-agent.js"></script><script src="../../integrations/openjobtracker/agent-dom.js"></script></html>
