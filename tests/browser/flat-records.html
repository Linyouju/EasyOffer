<!doctype html><meta charset="utf-8"><title>平铺经历回归</title><style>input,textarea{display:block;margin:6px;padding:6px}#audit{white-space:pre-wrap}</style><button id="run">运行测试</button><pre id="audit">待运行</pre><main id="forms"></main>
<script>
const bank=[{id:'work.0.company',label:'公司名称',value:'甲公司'},{id:'work.1.company',label:'公司名称',value:'乙公司'},...['甲','乙'].flatMap((v,i)=>[{id:`work.${i}.description`,label:'完整原始描述',value:v+'职责'},{id:`work.${i}.start`,label:'开始日期',value:'2025-08-18',kind:'date'},{id:`work.${i}.end`,label:'结束日期',value:'2025-11-07',kind:'date'}]),{id:'award.0.name',label:'奖项名称',value:'2026设计奖'},{id:'award.0.date',label:'获奖时间',value:'2026-08-26',kind:'date'},{id:'award.0.level',label:'奖项等级',value:'二等奖'}];
const nested=html=>'<div>'.repeat(11)+html+'</div>'.repeat(11);
const field=(label,html)=>`<div><div>${label}</div>${nested(html)}</div>`;
forms.innerHTML='<div>实习经历</div><div>'+['乙公司','甲公司'].map((n,i)=>field('公司名称',`<input id="name${i}" value="${n}">`)+field('起止时间',`<div><input type="text" id="start${i}"></div><div><input type="text" id="end${i}"></div>`)+field('描述',`<textarea id="desc${i}">${i?'手动保留':''}</textarea>`)+'<button>删除</button>').join('')+'</div><div>获奖</div><div>'+[0,1].map(i=>field('获奖名称',`<input id="award${i}">`)+field('获奖时间',`<input id="year${i}" placeholder="YYYY">`)+field('描述',`<textarea id="awarddesc${i}"></textarea>`)+'<button>删除</button>').join('')+'</div>';
const listeners=[];window.chrome={runtime:{onMessage:{addListener:f=>listeners.push(f),removeListener(){}},sendMessage:async m=>m.type==='OJT_AGENT_RESUME'?{resume:false}:{ok:true,mappings:[]}},storage:{local:{get:async()=>({knowledgeLibrary:{authority:{active:true,bank}}})}}};run.onclick=()=>listeners.forEach(f=>f({type:'START_APPLICATION_AGENT'},{},()=>{}));
</script><script src="../../integrations/openjobtracker/ui-icons.js"></script><script src="../../integrations/openjobtracker/semantic-mapper.js"></script><script src="../../integrations/openjobtracker/content.js"></script><script src="../../integrations/openjobtracker/application-agent.js"></script><script src="../../integrations/openjobtracker/agent-dom.js"></script><script>
const emit=ApplicationAgent.Runner.prototype.emit;ApplicationAgent.Runner.prototype.emit=function(m,e){emit.call(this,m,e);if(!['done','blocked'].includes(this.status))return;const checks={'平铺倒序经历归属':desc0.value==='乙职责','手动文字保留':desc1.value==='手动保留','成对日期区分起止':start0.value==='2025-08-18'&&end0.value==='2025-11-07','简短获奖标题':award0.value==='2026设计奖','获奖描述选择等级':awarddesc0.value==='二等奖','仅年份控件':year0.value==='2026','多余空记录不重复':award1.value===''};audit.textContent=Object.entries(checks).map(([k,v])=>(v?'PASS':'FAIL')+' '+k).join('\n')+'\n'+(e?.missing||[]).join('\n');};
</script>
