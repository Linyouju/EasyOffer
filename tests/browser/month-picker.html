<!doctype html><meta charset="utf-8"><title>月份选择器回归</title>
<style>td,button{padding:10px}#panel{border:1px solid gray}input{padding:10px}</style>
<button id="run">验证月份控件</button><pre id="audit">待运行</pre><div><span>开始时间</span><div id="control"><div id="selected"></div><ul><li><input readonly placeholder="请选择" id="date"></li></ul></div></div><div id="panel" hidden></div>
<script>window.chrome={runtime:{onMessage:{addListener(){}}}};let year=2026;function months(){panel.replaceWith(panel.cloneNode(false));panel.innerHTML='<div role="button" id="year">'+year+'</div><table><tr>'+Array.from({length:12},(_,i)=>'<td>'+ (i+1)+'月</td>').join('')+'</tr></table>';document.querySelector('#year').onclick=years;panel.querySelectorAll('td').forEach((td,i)=>td.onclick=()=>{selected.textContent=year+'-'+String(i+1).padStart(2,'0');panel.hidden=true;});}function years(){panel.replaceWith(panel.cloneNode(false));panel.innerHTML='<table><tr>'+[2024,2025,2026,2027].map(y=>'<td>'+y+'</td>').join('')+'</tr></table>';panel.querySelectorAll('td').forEach(td=>td.onclick=()=>{year=Number(td.textContent);months();});}date.onclick=()=>{panel.hidden=false;months();};</script>
<script src="../../integrations/openjobtracker/content.js"></script>
<script>run.onclick=async()=>{const results=[];for(const [value,expected] of [['2024-07','2024-07'],['2026-05-26','2026-05']]){selected.textContent='';date.value='';const ok=await OJTFormCore.writeMappedField(date,{id:'work.0.start',label:'开始日期',kind:'date',value});results.push((ok&&selected.textContent===expected&&date.value===''?'PASS':'FAIL')+' '+value+' → '+selected.textContent+' (空搜索框不冒充选中值)');}audit.textContent=results.join('\n');};</script>
