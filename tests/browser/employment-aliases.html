<!doctype html><meta charset="utf-8"><title>实习字段同义词回归</title><button id="run">运行测试</button><pre id="audit">待运行</pre>
<section><h2>实习经历</h2><div><strong>字节跳动</strong><p>已保存经历</p></div><div><strong>宝马（BMW）</strong><p>已保存经历</p></div>
<div><label>工作单位<input id="company"></label><label>入职时间<input id="start" type="month"></label><label>离职时间<input id="end" type="month"></label><label>职位<input id="position"></label><label>工作描述<textarea id="description"></textarea></label></div></section>
<section><h2>项目经验</h2><div><label>项目全称<input id="project"></label><label>开始时间<input id="ps" type="month"></label><label>结束时间<input id="pe" type="month"></label><label>项目描述<textarea id="pd"></textarea></label></div></section>
<script>
const bank=['腾讯','字节跳动','宝马（BMW）'].flatMap((company,i)=>Object.entries({company,position:'交互设计',start:'2026-05-26',end:'2026-09-21',description:company+'工作描述'}).map(([key,value])=>({id:`work.${i}.${key}`,label:key,value,kind:/start|end/.test(key)?'date':'text'}))).concat(Object.entries({name:'皮肤编辑器',start:'2026-08-03',end:'2026-09-01',description:'项目描述原文'}).map(([key,value])=>({id:'project.0.'+key,label:key,value,kind:/start|end/.test(key)?'date':'text'})));
const listeners=[];window.chrome={runtime:{onMessage:{addListener:f=>listeners.push(f),removeListener(){}},sendMessage:async m=>m.type==='OJT_AGENT_RESUME'?{resume:false}:{ok:true,mappings:[]}},storage:{local:{get:async()=>({knowledgeLibrary:{authority:{active:true,bank}}})}}};run.onclick=()=>listeners.forEach(f=>f({type:'START_APPLICATION_AGENT'},{},()=>{}));
</script><script src="../../integrations/openjobtracker/ui-icons.js"></script><script src="../../integrations/openjobtracker/semantic-mapper.js"></script><script src="../../integrations/openjobtracker/content.js"></script><script src="../../integrations/openjobtracker/application-agent.js"></script><script src="../../integrations/openjobtracker/agent-dom.js"></script><script>
const emit=ApplicationAgent.Runner.prototype.emit;ApplicationAgent.Runner.prototype.emit=function(m,e){emit.call(this,m,e);if(!['done','blocked'].includes(this.status))return;const checks={'工作单位分配剩余实习':company.value==='腾讯','入职和离职时间':start.value==='2026-05'&&end.value==='2026-09','职位和描述':position.value==='交互设计'&&description.value==='腾讯工作描述','项目全称与描述':project.value==='皮肤编辑器'&&pd.value==='项目描述原文','项目时间':ps.value==='2026-08'&&pe.value==='2026-09'};audit.textContent=Object.entries(checks).map(([k,v])=>(v?'PASS':'FAIL')+' '+k).join('\n');};
</script>
